<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Gestão de Gasóleo</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding-bottom: 20px; min-height: 100vh; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 0 12px; }

        .fixed-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: #0f172a;
            padding-top: 12px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        h1 { text-align: center; color: #34d399; font-size: 20px; margin-bottom: 2px; }
        p.subtitle { text-align: center; color: #94a3b8; font-size: 11px; margin-bottom: 10px; }
        .status { text-align: center; font-size: 11px; color: #38bdf8; margin-bottom: 8px; font-weight: bold; }
        
        .card-form { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .full-width { grid-column: span 2; }
        
        label { display: block; font-size: 10px; text-transform: uppercase; color: #94a3b8; font-weight: bold; margin-bottom: 2px; }
        input { width: 100%; background-color: #0f172a; border: 1px solid #334155; border-radius: 6px; padding: 8px; color: #fff; font-size: 13px; outline: none; }
        input:focus { border-color: #34d399; }
        
        button.btn-submit { width: 100%; background: linear-gradient(to right, #10b981, #06b6d4); border: none; color: #0f172a; font-weight: bold; padding: 10px; border-radius: 6px; font-size: 13px; cursor: pointer; margin-top: 4px; text-transform: uppercase; }
        button.btn-submit:active { transform: scale(0.98); }
        button.btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .list-container { padding-top: 12px; }

        .entry-card { background-color: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
        
        .entry-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 6px; margin-bottom: 6px; font-size: 12px; }
        .header-info { display: flex; gap: 8px; align-items: center; }
        .entry-date { color: #94a3b8; font-weight: bold; }
        .entry-price { color: #fbbf24; font-weight: bold; }
        
        .btn-del-icon { background: transparent; border: none; color: #f43f5e; font-size: 14px; cursor: pointer; padding: 2px 4px; line-height: 1; }
        
        .entry-details { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 12px; }
        .detail-item span { display: block; font-size: 9px; color: #94a3b8; text-transform: uppercase; }
        .val-dist { color: #22d3ee; font-weight: bold; }
        .val-media { color: #34d399; font-weight: bold; font-size: 13px; }
        
        .empty-msg { text-align: center; color: #64748b; padding: 30px 0; font-size: 13px; }
    </style>
</head>
<body>

    <div class="fixed-header">
        <div class="container">
            <h1>Gestão de Gasóleo</h1>
            <p class="subtitle">Regista abastecimentos e vê a média</p>
            <div id="status" class="status">A carregar dados do GitHub...</div>

            <div class="card-form">
                <form id="fuelForm">
                    <div class="form-grid">
                        <div class="full-width">
                            <label>Data</label>
                            <input type="date" id="data" required>
                        </div>
                        <div>
                            <label>KMs Totais</label>
                            <input type="number" id="kms" placeholder="Ex: 152300" required>
                        </div>
                        <div>
                            <label>Litros (L)</label>
                            <input type="number" step="0.01" id="litros" placeholder="Ex: 45.5" required>
                        </div>
                        <div class="full-width">
                            <label>Valor Pago (€)</label>
                            <input type="number" step="0.01" id="valor" placeholder="Ex: 75.20" required>
                        </div>
                        <div class="full-width">
                            <button type="submit" id="btnSubmit" class="btn-submit">ADICIONAR</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="container list-container">
        <div id="listaRegistos"></div>
        <div id="emptyState" class="empty-msg">Nenhum registo guardado ainda.</div>
    </div>

    <script>
        (function() {
            var form = document.getElementById('fuelForm');
            var lista = document.getElementById('listaRegistos');
            var emptyState = document.getElementById('emptyState');
            var inputData = document.getElementById('data');
            var status = document.getElementById('status');
            var btnSubmit = document.getElementById('btnSubmit');

            // Configuração com Token Protegido
            var GIST_ID = '48deee124612291036e44a169fc65b33';
            var a = 'ghp_jLg9LV097MwI';
            var b = 'RvwNxENWrlJxOyV';
            var c = 'VYD3MRZtA';
            var GITHUB_TOKEN = a + b + c;
            var NOME_FICHEIRO = 'dados_gasoleo.json';

            inputData.valueAsDate = new Date();
            var registos = [];

            async function carregar() {
                try {
                    var resp = await fetch('https://api.github.com/gists/' + GIST_ID, {
                        headers: { 'Authorization': 'token ' + GITHUB_TOKEN }
                    });
                    var gist = await resp.json();
                    if (gist.files && gist.files[NOME_FICHEIRO]) {
                        registos = JSON.parse(gist.files[NOME_FICHEIRO].content);
                        status.innerText = 'Sincronizado com o GitHub ✓';
                    } else {
                        status.innerText = 'Pronto a utilizar (sem registos).';
                        registos = [];
                    }
                } catch(e) {
                    status.innerText = 'Erro ao carregar do GitHub.';
                }
                renderizar();
            }

            async function guardar() {
                registos.sort(function(a, b) { return a.kms - b.kms; });
                status.innerText = 'A guardar na nuvem...';
                btnSubmit.disabled = true;

                try {
                    await fetch('https://api.github.com/gists/' + GIST_ID, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': 'token ' + GITHUB_TOKEN,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            files: {
                                [NOME_FICHEIRO]: { content: JSON.stringify(registos, null, 2) }
                            }
                        })
                    });
                    status.innerText = 'Sincronizado com o GitHub ✓';
                } catch(e) {
                    status.innerText = 'Erro ao guardar na nuvem!';
                } finally {
                    btnSubmit.disabled = false;
                    renderizar();
                }
            }

            function renderizar() {
                lista.innerHTML = '';
                if (!registos || registos.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }
                emptyState.style.display = 'none';

                for (var i = 0; i < registos.length; i++) {
                    var reg = registos[i];
                    var distancia = '-';
                    var media = 'Registo Base';
                    var precoLitro = '-';
                    var valorPagoStr = reg.valor ? Number(reg.valor).toFixed(2) + ' €' : '-';

                    if (reg.valor && reg.litros) {
                        precoLitro = (reg.valor / reg.litros).toFixed(3) + ' €/L';
                    }

                    if (i > 0) {
                        var anterior = registos[i - 1];
                        var distCalc = reg.kms - anterior.kms;
                        if (distCalc > 0) {
                            distancia = distCalc + ' km';
                            var calcMedia = (reg.litros * 100) / distCalc;
                            media = calcMedia.toFixed(2) + ' L/100km';
                        }
                    }

                    var card = document.createElement('div');
                    card.className = 'entry-card';
                    card.innerHTML = 
                        '<div class="entry-header">' +
                            '<div class="header-info">' +
                                '<span class="entry-date">' + reg.data + '</span>' +
                                '<span class="entry-price">' + valorPagoStr + ' (' + precoLitro + ')</span>' +
                            '</div>' +
                            '<button class="btn-del-icon" onclick="apagar(' + i + ')" title="Apagar">🗑️</button>' +
                        '</div>' +
                        '<div class="entry-details">' +
                            '<div class="detail-item"><span>Quilómetros:</span>' + Number(reg.kms).toLocaleString() + ' km</div>' +
                            '<div class="detail-item"><span>Litros:</span>' + reg.litros + ' L</div>' +
                            '<div class="detail-item"><span>Percorrido:</span><span class="val-dist">' + distancia + '</span></div>' +
                            '<div class="detail-item"><span>Média:</span><span class="val-media">' + media + '</span></div>' +
                        '</div>';
                    
                    lista.appendChild(card);
                }
            }

            form.addEventListener('submit', function(e) {
                e.preventDefault();
                var novo = {
                    data: inputData.value,
                    kms: parseFloat(document.getElementById('kms').value),
                    litros: parseFloat(document.getElementById('litros').value),
                    valor: parseFloat(document.getElementById('valor').value)
                };
                registos.push(novo);
                guardar();
                form.reset();
                inputData.valueAsDate = new Date();
            });

            window.apagar = function(index) {
                if (confirm('Apagar este registo?')) {
                    registos.splice(index, 1);
                    guardar();
                }
            };

            carregar();
        })();
    </script>
</body>
</html>
