<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registo de Combustível Sincronizado</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 16px; background-color: #f4f6f8; color: #333; }
    h2 { text-align: center; color: #0056b3; }
    .card { background: white; padding: 16px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 16px; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { width: 100%; padding: 12px; margin-top: 12px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; }
    button:hover { background-color: #218838; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: center; font-size: 14px; }
    th { background-color: #0056b3; color: white; }
    .btn-delete { background-color: #dc3545; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; width: auto; font-size: 12px; }
    .status { text-align: center; font-size: 12px; color: #666; margin-bottom: 8px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Registo de Abastecimentos</h2>
  <div id="status" class="status">A carregar dados do GitHub...</div>

  <div class="card">
    <label>Data:</label>
    <input type="date" id="data">

    <label>Quilómetros (Km):</label>
    <input type="number" id="kms" placeholder="Ex: 150000">

    <label>Litros (L):</label>
    <input type="number" step="0.01" id="litros" placeholder="Ex: 45.5">

    <label>Valor Pago (€):</label>
    <input type="number" step="0.01" id="valor" placeholder="Ex: 75.00">

    <button id="btnAdicionar" onclick="adicionarRegisto()">ADICIONAR</button>
  </div>

  <div class="card">
    <h3>Histórico</h3>
    <table>
      <thead>
        <tr>
          <th>Data</th>
          <th>Km</th>
          <th>Litros</th>
          <th>€</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tabelaRegistos"></tbody>
    </table>
  </div>

  <script>
    // Configuração da Sincronização
    const GIST_ID = '48deee124612291036e44a169fc65b33';
    const GITHUB_TOKEN = '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';
    const NOME_FICHEIRO_DADOS = 'dados_gasoleo.json';

    document.getElementById('data').valueAsDate = new Date();

    async function carregarRegistos() {
      const status = document.getElementById('status');
      try {
        const resp = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
          headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
        });
        const gist = await resp.json();
        
        if (gist.files && gist.files[NOME_FICHEIRO_DADOS]) {
          const conteudo = gist.files[NOME_FICHEIRO_DADOS].content;
          status.innerText = 'Sincronizado com o GitHub ✓';
          return JSON.parse(conteudo);
        } else {
          status.innerText = 'Pronto a utilizar (sem registos anteriores).';
          return [];
        }
      } catch (e) {
        status.innerText = 'Erro ao carregar dados do GitHub.';
        return [];
      }
    }

    async function guardarRegistos(registos) {
      const status = document.getElementById('status');
      const btn = document.getElementById('btnAdicionar');
      status.innerText = 'A guardar dados na nuvem...';
      btn.disabled = true;

      try {
        await fetch(`https://api.github.com/gists/${GIST_ID}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${GITHUB_TOKEN}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            files: {
              [NOME_FICHEIRO_DADOS]: {
                content: JSON.stringify(registos, null, 2)
              }
            }
          })
        });
        status.innerText = 'Sincronizado com o GitHub ✓';
        desenharTabela(registos);
      } catch (e) {
        status.innerText = 'Erro ao guardar dados.';
        alert('Ocorreu um erro ao guardar no GitHub.');
      } finally {
        btn.disabled = false;
      }
    }

    async function adicionarRegisto() {
      const data = document.getElementById('data').value;
      const kms = document.getElementById('kms').value;
      const litros = document.getElementById('litros').value;
      const valor = document.getElementById('valor').value;

      if (!data || !kms || !litros || !valor) {
        alert('Por favor, preencha todos os campos.');
        return;
      }

      const novo = { data, kms, litros, valor };
      const registos = await carregarRegistos();
      registos.push(novo);

      await guardarRegistos(registos);

      document.getElementById('kms').value = '';
      document.getElementById('litros').value = '';
      document.getElementById('valor').value = '';
    }

    async function apagarRegisto(index) {
      if (confirm('Tem a certeza que deseja apagar este registo?')) {
        const registos = await carregarRegistos();
        registos.splice(index, 1);
        await guardarRegistos(registos);
      }
    }

    function desenharTabela(registos) {
      const tbody = document.getElementById('tabelaRegistos');
      tbody.innerHTML = '';

      registos.forEach((r, index) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${r.data}</td>
          <td>${r.kms}</td>
          <td>${r.litros}</td>
          <td>${r.valor}€</td>
          <td><button class="btn-delete" onclick="apagarRegisto(${index})">X</button></td>
        `;
        tbody.appendChild(tr);
      });
    }

    (async () => {
      const registos = await carregarRegistos();
      desenharTabela(registos);
    })();
  </script>
</body>
</html>
